app: acestream-$ACE_VERSION
ingredients:
  dist: trixie
  sources:
    - deb http://deb.debian.org/debian trixie main
    - deb http://deb.debian.org/debian trixie-updates main
    - deb http://deb.debian.org/debian-security trixie-security main
  packages:
    - curl
    - openssl
    - libsqlite3-0
    - libterm-readline-gnu-perl
  script:
    - PPWD=$(pwd)
    - curl -ksL "https://www.python.org/ftp/python/$PYTHON_VERSION/Python-$PYTHON_VERSION.tgz" | tar -xz
    - cd "Python-$PYTHON_VERSION"
    - apt update
    - apt install -y acl tk-dev zlib1g-dev libssl-dev libsqlite3-dev libffi-dev build-essential
    - ./configure --prefix="${PPWD}"/usr/local --enable-optimizations --enable-shared
    - make -j4 altinstall
    - make clean
    - apt purge -y --autoremove acl tk-dev zlib1g-dev libssl-dev libsqlite3-dev libffi-dev build-essential
    - apt autoclean
    - apt clean
    - rm -vrf /var/cache/apt/*
    - rm -vrf /var/lib/apt/*
    - cd "${PPWD}"
    - rm -vrf "Python-$PYTHON_VERSION"
    - export LD_LIBRARY_PATH="${PPWD}/usr/local/lib":/x86_64-linux-gnu:/usr/lib:/lib
    - export PATH="${PPWD}"/usr/local/bin:${PATH}
    - curl -ksL "${ACE_URL_APP}" | tar -xz
    - python3.10 -m pip install --upgrade pip
    - python3.10 -m pip install -r requirements.txt
    - curl -ksL "${ACE_URL_ICON}" -o acestream-$ACE_VERSION.png

script:
  - touch "acestream-$ACE_VERSION.desktop"
  - sed -i "s#/usr/bin/acestream-$ACE_VERSION#AppRun#g" "acestream-$ACE_VERSION.desktop"
  - mkdir -p opt/acestream usr/local
  - cp -rf ../usr/local/* usr/local
  - cp -rf ../{acestream.conf,engine_version.json,acestreamengine,start-engine,data,lib} opt/acestream
  - cp ../acestream-$ACE_VERSION.png ./"acestream-$ACE_VERSION.png"
  - cat > "acestream-$ACE_VERSION.desktop" <<EOF
  - [Desktop Entry]
  - Type=Application
  - Name=AceStream-$ACE_VERSION
  - Icon=acestream-$ACE_VERSION.png
  - Exec=/usr/local/bin/acestream-$ACE_VERSION
  - Categories=GNOME;GTK;Network;
  - StartupNotify=true
  - EOF
  - if [ "$ACESTREAM_DESKTOP_INTEGRATION" = 'yes' ]; then
  - touch .ACESTREAM_DESKTOP_INTEGRATION
  - fi
  - cat > ./AppRun <<\EOF
  - #!/bin/bash
  - ACECON=''
  - HERE=$(dirname $(readlink -f "${0}"))
  - ROOT="${HERE}/opt/acestream"
  - CONF_PATH="$(dirname $APPIMAGE)"
  - export LD_LIBRARY_PATH="$ROOT/lib":"$HERE/usr/local/lib":"$HERE/usr/local/lib/python3.10":"$HERE/usr/lib/x86_64-linux-gnu":/usr/lib:/lib
  - export PYTHONHOME="$HERE/usr/local"
  - export PYTHONPATH="$HERE/usr/local/lib/python310.zip":"$HERE/usr/local/lib/python3.10":"$HERE/usr/local/lib/python3.10/lib-dynload":"$HERE/usr/local/lib/python3.10/site-packages"
  - export PATH="$HERE/usr/local/bin":"$HERE/usr/bin":"$HERE/bin":"$HERE/sbin":"$HERE/usr/sbin":"$PATH"
  - ACE_VERSION=$("${ROOT}"/acestreamengine --version | grep -Eo "[0-9.]+" | head -n 1)
  - if [ -f "$HERE/.ACESTREAM_DESKTOP_INTEGRATION" ] || [ "$ACESTREAM_DESKTOP_INTEGRATION" = 'yes' ]; then
  - cp -rf "$HERE/acestream-$ACE_VERSION.png" "/home/$USER/.local/share/icons/"
  - cp -rf "$HERE/acestream-$ACE_VERSION.desktop" "/home/$USER/.local/share/applications/acestream-start-$ACE_VERSION.desktop"
  - cp -rf "/home/$USER/.local/share/applications/acestream-start-$ACE_VERSION.desktop" "/home/$USER/.local/share/applications/acestream-stop-$ACE_VERSION.desktop"
  - sed -i '3,5d' "/home/$USER/.local/share/applications/acestream-start-$ACE_VERSION.desktop"
  - cp -rf "/home/$USER/.local/share/applications/acestream-start-$ACE_VERSION.desktop" "/home/$USER/.local/share/applications/acestream-stop-$ACE_VERSION.desktop"
  - sed -i "2a\Name=Start AceStream-$ACE_VERSION\nExec=$APPIMAGE\nIcon=/home/$USER/.local/share/icons/acestream-$ACE_VERSION.png" "/home/$USER/.local/share/applications/acestream-start-$ACE_VERSION.desktop"
  - sed -i "2a\Name=Stop AceStream-$ACE_VERSION\nExec=/usr/bin/pkill --signal SIGHUP acestreamengine\nIcon=/home/$USER/.local/share/icons/acestream-$ACE_VERSION.png" "/home/$USER/.local/share/applications/acestream-stop-$ACE_VERSION.desktop"
  - fi
  - if [ -f /etc/acestream/acestream.conf ]; then
  - ACECON="@/etc/acestream/acestream.conf"
  - fi
  - if [ -f "$CONF_PATH/acestream.conf" ]; then
  - ACECON="@$CONF_PATH/acestream.conf"
  - fi
  - "${ROOT}"/acestreamengine $ACECON "$@"
  - EOF
  - chmod +x ./AppRun
  - echo $ACE_VERSION > ../VERSION
